<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>NEON ROYALE</title>

    <!-- GitHub Pages -->
    <link rel="stylesheet" href="./app.css">
</head>

<body>

    <!-- =========================
         AUTH
    ========================== -->

    <div id="auth" class="auth">

        <div class="authbox">

            <div class="brand">
                NEON <b>ROYALE</b>
            </div>

            <div class="tag">
                ORIGINAL CREDIT ARCADE
            </div>

            <div class="tabs">

                <button
                    class="active"
                    data-tab="login"
                    type="button"
                >
                    LOGIN
                </button>

                <button
                    data-tab="signup"
                    type="button"
                >
                    SIGN UP
                </button>

            </div>


            <!-- LOGIN -->

            <form id="login">

                <input
                    name="username"
                    placeholder="Username"
                    autocomplete="username"
                    required
                >

                <input
                    name="password"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    LOGIN
                </button>

            </form>


            <!-- SIGN UP -->

            <form
                id="signup"
                class="hidden"
            >

                <input
                    name="username"
                    placeholder="Username"
                    autocomplete="username"
                    required
                >

                <input
                    name="displayName"
                    placeholder="Display name"
                    required
                >

                <input
                    name="password"
                    type="password"
                    placeholder="Password 6+"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <button type="submit">
                    CREATE ACCOUNT
                </button>

            </form>


            <p id="msg"></p>

            <small>
                Credit เป็นแต้มในเกมเท่านั้น
                ไม่มีเงินจริงหรือการถอนเงิน
            </small>

        </div>

    </div>


    <!-- =========================
         MAIN APP
    ========================== -->

    <div
        id="app"
        class="hidden"
    >

        <!-- HEADER -->

        <header>

            <div class="brand small">
                NEON <b>ROYALE</b>
            </div>


            <nav>

                <a href="#games">
                    GAMES
                </a>

                <a href="#rank">
                    RANK
                </a>

                <a href="#profile">
                    PROFILE
                </a>

            </nav>


            <div class="wallet">

                CREDIT

                <b id="credit">
                    0.00
                </b>

            </div>


            <button
                id="logout"
                type="button"
            >
                LOGOUT
            </button>

        </header>


        <main>

            <!-- =====================
                 HERO
            ====================== -->

            <section class="hero">

                <div>

                    <div class="tag">
                        ORIGINAL GAME HUB
                    </div>

                    <h1>
                        PLAY YOUR<br>
                        WAY.
                    </h1>

                    <p>
                        10 original arcade experiences.
                    </p>

                </div>

            </section>


            <!-- =====================
                 SEARCH / CATEGORY
            ====================== -->

            <section class="tools">

                <div class="search">

                    <span>⌕</span>

                    <input
                        id="search"
                        type="search"
                        placeholder="Search games..."
                        autocomplete="off"
                    >

                </div>


                <div class="cats">

                    <button
                        class="active"
                        data-cat="all"
                        type="button"
                    >
                        ALL
                    </button>

                    <button
                        data-cat="reel"
                        type="button"
                    >
                        REELS
                    </button>

                    <button
                        data-cat="special"
                        type="button"
                    >
                        SPECIAL
                    </button>

                    <button
                        data-cat="arcade"
                        type="button"
                    >
                        ARCADE
                    </button>

                </div>

            </section>


            <!-- =====================
                 GAME LIBRARY
            ====================== -->

            <section
                id="games"
                class="section"
            >

                <div class="tag">
                    GAME LIBRARY
                </div>

                <h2>
                    ORIGINAL GAMES
                </h2>

                <div
                    id="grid"
                    class="grid"
                ></div>

            </section>


            <!-- =====================
                 RANK
            ====================== -->

            <section
                id="rank"
                class="section"
            >

                <div class="tag">
                    RANK
                </div>

                <h2>
                    LEADERBOARD
                </h2>

                <div class="panel">

                    <table>

                        <tbody id="rank">
                        </tbody>

                    </table>

                </div>

            </section>


            <!-- =====================
                 PROFILE
            ====================== -->

            <section
                id="profile"
                class="section"
            >

                <div class="tag">
                    PLAYER
                </div>

                <h2>
                    PROFILE
                </h2>

                <div
                    id="stats"
                    class="stats"
                ></div>

            </section>

        </main>

    </div>


    <!-- =========================
         GAME MODAL
    ========================== -->

    <div
        id="modal"
        class="modal hidden"
    >

        <div class="game">

            <button
                class="close"
                id="close"
                type="button"
                aria-label="Close"
            >
                ×
            </button>


            <div id="title"></div>


            <div class="gamebar">

                <span>
                    CREDIT
                    <b id="gcredit">
                        0.00
                    </b>
                </span>


                <span>

                    BET

                    <button
                        id="betMinus"
                        type="button"
                    >
                        −
                    </button>

                    <b id="betValue">
                        1.00
                    </b>

                    <button
                        id="betPlus"
                        type="button"
                    >
                        +
                    </button>

                </span>

            </div>


            <div
                id="reels"
                class="reels"
            ></div>


            <div id="result"></div>


            <button
                id="spin"
                class="spin"
                type="button"
            >
                SPIN
            </button>


            <div class="tools2">

                <button
                    id="turbo"
                    type="button"
                >
                    ⚡ TURBO
                </button>

                <button
                    id="paytable"
                    type="button"
                >
                    PAYTABLE
                </button>

                <button
                    id="history"
                    type="button"
                >
                    HISTORY
                </button>

            </div>

        </div>

    </div>


    <!-- GitHub Pages path -->
    <script src="./app.js"></script>

</body>
</html>
